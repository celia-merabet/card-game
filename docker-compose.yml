services:


  web:

    build: .

    container_name: cardgame_web


    command:

      sh -c "

      python manage.py migrate &&

      python manage.py collectstatic --noinput &&

      gunicorn config.wsgi:application --bind 0.0.0.0:8000

      "


    ports:

      - "8000:8000"


    volumes:

      - .:/app


    env_file:

      - .env


    depends_on:

      db:

        condition: service_healthy


      redis:

        condition: service_started



  db:


    image: postgres:16


    container_name: cardgame_postgres


    environment:

      POSTGRES_DB: cardgame

      POSTGRES_USER: carduser

      POSTGRES_PASSWORD: password


    volumes:

      - postgres_data:/var/lib/postgresql/data



    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U carduser"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



  redis:


    image: redis:7


    container_name: cardgame_redis



volumes:


  postgres_data: