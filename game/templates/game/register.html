<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inscription - Card Game</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #141414,
                #333333
            );

            color: white;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .card {
            background: #222;
            padding: 40px 35px;
            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            background: #111;

            border: 1px solid #555;
            border-radius: 8px;

            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: white;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }

        .errorlist {
            color: #ff9999;
            list-style: none;
            margin-top: 5px;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
        }

        .footer a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            🃏
        </div>

        <h1>
            Créer un compte
        </h1>

        <p class="subtitle">
            Rejoignez Card Game
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="form-group">

                <label for="{{ form.username.id_for_label }}">
                    Nom d'utilisateur
                </label>

                {{ form.username }}

                {{ form.username.errors }}

            </div>

            <div class="form-group">

                <label for="{{ form.password1.id_for_label }}">
                    Mot de passe
                </label>

                {{ form.password1 }}

                {{ form.password1.errors }}

            </div>

            <div class="form-group">

                <label for="{{ form.password2.id_for_label }}">
                    Confirmer le mot de passe
                </label>

                {{ form.password2 }}

                {{ form.password2.errors }}

            </div>

            <button type="submit">
                Créer mon compte
            </button>

        </form>

        <div class="footer">

            <p>
                Vous avez déjà un compte ?
            </p>

            <a href="{% url 'login' %}">
                Se connecter
            </a>

        </div>

        <a
            href="{% url 'home' %}"
            class="back"
        >
            ← Retour à l'accueil
        </a>

    </div>

</div>

</body>

</html>
